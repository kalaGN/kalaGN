<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 296" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <!--
    Terminal hero for @kalaGN  ( repo: kalaGN/kalaGN , file: assets/hero-*.svg )
    Theme "Night Terminal" - violet #8b5cf6 + cyan #22d3ee on #0d1117.
    Re colour by find/replace of those two hex codes.
    Generated by build_hero.py - the KALAGN mark is a 5x7 dot matrix,
    one <rect> per lit pixel at 14px pitch / 11px cell.
  -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8b5cf6" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <style>
    .roles text{opacity:0; animation:cyc 16s linear infinite}
    .r1{animation-delay:0s!important} .r2{animation-delay:4s!important} .r3{animation-delay:8s!important} .r4{animation-delay:12s!important}
    @keyframes cyc{0%{opacity:0}3%,20%{opacity:1}24%,100%{opacity:0}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>
  <rect x="8" y="8" width="984" height="280" rx="14" fill="#0d1117"/>
  <rect x="8" y="8" width="984" height="280" rx="14" fill="url(#grid)"/>
  <rect x="8.5" y="8.5" width="983" height="279" rx="13.5" fill="none" stroke="#1e2735"/>
  <rect x="9" y="9" width="982" height="2" fill="url(#edge)" opacity=".5"/>

